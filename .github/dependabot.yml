# Only the workflow's actions: the scripts are PowerShell with no package
# dependencies, and ExifTool is installed by the user.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore"
    # Monday, Wednesday and Friday.
    schedule:
      interval: "cron"
      cronjob: "30 7 * * 1,3,5"
      timezone: "Europe/Lisbon"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
